name: Snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#126BFC&color_dots=#ebedf0,#c6dbfe,#7fb0fd,#3d87fc,#126BFC
            dist/snake-dark.svg?palette=github-dark&color_snake=#126BFC&color_dots=#161b22,#0b2a63,#0d4bb0,#1060e0,#126BFC

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
